name: Validate release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Documentation and publication safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Run the release validation suite
        run: |
          release_tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
          fi
          scripts/validate-release.sh "$release_tag"

      - name: Verify shallow-clone behavior
        run: |
          shallow_root="$(mktemp -d)"
          git init "$shallow_root/repository"
          git -C "$shallow_root/repository" remote add origin "$GITHUB_WORKSPACE"
          git -C "$shallow_root/repository" fetch --depth 1 --no-tags origin HEAD
          git -C "$shallow_root/repository" checkout --detach FETCH_HEAD
          output="$shallow_root/validation.log"
          (
            cd "$shallow_root/repository"
            python3 scripts/validate-repository.py
          ) | tee "$output"
          grep -F "WARNING: shallow repository: historical review evidence is unavailable" "$output"
          grep -F "PASS: sanitized reachable public main history:" "$output"
          if grep -F "PASS: sanitized public main history:" "$output"; then
            echo "Shallow validation claimed full-history coverage." >&2
            exit 1
          fi
          release_output="$shallow_root/release-validation.log"
          if (
            cd "$shallow_root/repository"
            bash scripts/validate-release.sh
          ) >"$release_output" 2>&1; then
            echo "Shallow release validation unexpectedly passed." >&2
            exit 1
          fi
          grep -F "Release validation requires complete Git history." "$release_output"
