name: Validate framework

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository documents
        run: python3 scripts/validate_repository.py
      - name: Render inline Mermaid diagrams
        run: bash scripts/validate_mermaid.sh
